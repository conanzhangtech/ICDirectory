{{/* pdfviewer — certificate preview + link to the source PDF.

     Overrides the theme shortcode of the same name, keeping its signature
     (src / width / height) so no content had to change.

     The theme version framed the PDF directly (<iframe src="…​.pdf">), and so
     did the click-to-load facade that replaced it. Both hit the same wall:
     assets.isolatedcommand.com refuses to be framed, so the embed renders as
     "refused to connect" no matter when the iframe is attached. Framing is
     therefore off the table until that host sends a frame-ancestors policy
     allowing directory.isolatedcommand.com.

     Instead the page previews the certificate image it already has — the same
     asset the profile card uses, so it costs nothing extra to serve — and
     links out to the PDF. Pages with no image (`cert.image` empty) get the
     link on its own. Nothing here can be blocked by a framing policy.

     If the asset host is later configured to allow framing and an inline
     viewer is wanted back, this is the only file that needs to change. */}}

{{- $src := .Get "src" -}}
{{- $page := .Page -}}
{{- $img := "" -}}
{{- with $page.Params.cert -}}
  {{- with .image -}}
    {{- $slug := path.Base $page.Parent.RelPermalink -}}
    {{- $path := printf "images/awardsandachievements/%s/%s" $slug . -}}
    {{- $img = resources.Get $path -}}
    {{- if not $img }}{{ warnf "pdfviewer on %s: image not found at assets/%s" $page.Path $path }}{{ end -}}
  {{- end -}}
{{- end -}}

<div class="cert-doc">
  {{- with $img }}
  {{ $p := .Resize "1000x webp q78" }}
  <a class="cert-doc-preview" href="{{ $src }}" target="_blank" rel="noopener">
    <img src="{{ $p.RelPermalink }}" alt="{{ $page.LinkTitle }} certificate" loading="lazy" decoding="async">
  </a>
  {{- end }}
  <p class="cert-doc-actions">
    <a class="cert-doc-btn" href="{{ $src }}" target="_blank" rel="noopener">
      <i class="fas fa-file-pdf" aria-hidden="true"></i> Open the full certificate (PDF)
    </a>
  </p>
</div>

<style>
.cert-doc{margin:1rem 0}
.cert-doc-preview{display:block;border:1px solid rgba(128,128,128,.3);border-radius:10px;overflow:hidden}
.cert-doc-preview img{display:block;width:100%;height:auto}
.cert-doc-actions{margin:.75rem 0 0}
.cert-doc-btn{display:inline-block;padding:.55rem 1.1rem;border:1px solid currentColor;
  border-radius:6px;text-decoration:none}
.cert-doc-btn:hover{opacity:.75}
</style>
